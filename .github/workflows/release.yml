name: Release all platforms

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, for example v1.2.0'
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: 24
  ANDROID_PACKAGE: com.norat02.skybird

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        shell: bash
        run: |
          if [ -n "${GITHUB_REF_NAME}" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

  web:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - run: npm test
      - name: Package web bundle
        run: tar -czf "sky-bird-web-${{ needs.prepare.outputs.tag }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: sky-bird-web-*.tar.gz

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - run: npm ci
      - run: npm run build
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sky-upload.jks"
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build signed APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sky-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  desktop:
    needs: prepare
    name: Desktop ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            target: win
            files: 'dist/*.exe'
          - name: macOS
            runner: macos-latest
            target: mac
            files: |
              dist/*.dmg
              dist/*.zip
          - name: Linux
            runner: ubuntu-latest
            target: linux
            files: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y binutils
      - run: npx electron-builder --${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  ios:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Install Apple certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      - name: Install provisioning profile
        uses: apple-actions/download-provisioning-profiles@v4
        with:
          bundle-id: ${{ secrets.IOS_BUNDLE_ID }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      - name: Archive iOS app
        working-directory: ios
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/SkyBird.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic
      - name: Export IPA
        working-directory: ios
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SkyBird.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"
      - name: Rename IPA
        run: cp "$RUNNER_TEMP/ipa"/*.ipa "Sky-Bird-${{ needs.prepare.outputs.tag }}.ipa"
      - uses: actions/upload-artifact@v7
        with:
          name: release-ios
          path: '*.ipa'
          if-no-files-found: error

  macos-swiftui:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build native SwiftUI macOS app
        working-directory: macos/SkyBirdMac
        run: ./build-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-swiftui
          path: macos/SkyBirdMac/Sky Bird.app.zip
          if-no-files-found: error

  github-release:
    needs: [prepare, web, android, desktop, ios, macos-swiftui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Create GitHub Release and upload all assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test -n "$TAG"
          find release-assets -type f -maxdepth 2 -print
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sky Bird $TAG" \
            --generate-notes
