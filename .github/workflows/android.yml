name: Build Web and Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build shared Web client
        run: npm run build

      - name: Verify source and tests
        run: |
          npm run verify
          npm test

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Sync shared Web client into Capacitor
        run: npx cap sync android

      - name: Get Android certificate fingerprints
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew signingReport --no-daemon > signing-report.txt

          echo "## Android Certificate Fingerprints" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Package:** \`com.norat02.skybird\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo '```text' >> "$GITHUB_STEP_SUMMARY"

          grep -E \
            "Variant:|Config:|Store:|Alias:|SHA1:|SHA-256:" \
            signing-report.txt \
            | tee -a "$GITHUB_STEP_SUMMARY"

          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Use the SHA-1 fingerprint for Google Android OAuth." >> "$GITHUB_STEP_SUMMARY"

      - name: Build debug APK and AAB
        working-directory: android
        run: ./gradlew assembleDebug bundleDebug --no-daemon

      - name: Upload Web artifact
        uses: actions/upload-artifact@v7
        with:
          name: sky-bird-web
          path: dist

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sky-bird-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
