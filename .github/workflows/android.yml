name: Build Web and Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build shared Web client
        run: npm run build

      - name: Verify source and tests
        run: |
          npm run verify
          npm test

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Sync shared Web client into Capacitor
        run: npx cap sync android

      - name: Get Android certificate fingerprints
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$HOME/.config/.android/debug.keystore"
          ALIAS="AndroidDebugKey"

          if [ ! -f "$KEYSTORE" ]; then
            echo "::error::Debug keystore not found: $KEYSTORE"
            exit 1
          fi

          FINGERPRINTS="$(keytool -list -v \
            -keystore "$KEYSTORE" \
            -alias "$ALIAS" \
            -storepass android \
            -keypass android 2>/dev/null)"

          SHA1="$(printf '%s\n' "$FINGERPRINTS" | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -n 1)"
          SHA256="$(printf '%s\n' "$FINGERPRINTS" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1)"

          if [ -z "$SHA1" ]; then
            echo "::error::SHA-1 fingerprint could not be extracted."
            exit 1
          fi

          if [ -z "$SHA256" ]; then
            echo "::error::SHA-256 fingerprint could not be extracted."
            exit 1
          fi

          {
            echo "## Android Certificate Fingerprints"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Package | \`com.norat02.skybird\` |"
            echo "| Keystore | \`debug.keystore\` |"
            echo "| Alias | \`AndroidDebugKey\` |"
            echo "| SHA-1 | \`$SHA1\` |"
            echo "| SHA-256 | \`$SHA256\` |"
            echo ""
            echo "These fingerprints belong to the Android debug signing certificate."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "SHA-1: $SHA1"
          echo "SHA-256: $SHA256"

      - name: Build debug APK and AAB
        working-directory: android
        run: ./gradlew assembleDebug bundleDebug --no-daemon

      - name: Upload Web artifact
        uses: actions/upload-artifact@v7
        with:
          name: sky-bird-web
          path: dist

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sky-bird-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
