name: Build Web and Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # Public values are GitHub Actions Variables, not repository files.
      # Server secrets must never be placed in this .env.local file.
      - name: Configure public app environment
        env:
          VITE_PUBLIC_SITE_URL: ${{ vars.VITE_PUBLIC_SITE_URL }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_REDIRECT_URL: ${{ vars.VITE_SUPABASE_REDIRECT_URL }}
          VITE_NATIVE_OAUTH_REDIRECT_SCHEME: ${{ vars.VITE_NATIVE_OAUTH_REDIRECT_SCHEME }}
          ADSENSE_PUBLISHER_ID: ${{ vars.ADSENSE_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          umask 077
          cat > .env.local <<EOF
          VITE_PUBLIC_SITE_URL=${VITE_PUBLIC_SITE_URL}
          VITE_API_BASE_URL=${VITE_API_BASE_URL}
          VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
          VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
          VITE_SUPABASE_REDIRECT_URL=${VITE_SUPABASE_REDIRECT_URL}
          VITE_NATIVE_OAUTH_REDIRECT_SCHEME=${VITE_NATIVE_OAUTH_REDIRECT_SCHEME:-com.norat02.skybird}
          ADSENSE_PUBLISHER_ID=${ADSENSE_PUBLISHER_ID}
          EOF

      - name: Build shared Web client
        run: npm run build

      - name: Verify source and security tests
        run: |
          npm run verify
          npm test
          npm run test:api
          npm run test:api:integration

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action defaults to the removed legacy `tools` package.
          # Install supported SDK packages explicitly in the next step.
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Sync shared Web client into Capacitor
        run: npx cap sync android

      - name: Verify Android project
        working-directory: android
        run: |
          set -euo pipefail
          test -f ./gradlew
          chmod +x ./gradlew
          ./gradlew --version

      # The keystore and passwords are GitHub Actions Secrets.
      # Create ANDROID_KEYSTORE_BASE64 with: base64 -w 0 sky-release.jks
      - name: Build release APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Release signing secrets detected; building signed artifacts."
          else
            echo "Release signing secrets are absent; building unsigned validation artifacts."
            echo "Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD for Play-ready signed output."
          fi
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ github.workspace }}/android/app/build/outputs/apk/release/app-release.apk"
          AAB="${{ github.workspace }}/android/app/build/outputs/bundle/release/app-release.aab"
          if [[ ! -s "$APK" ]]; then
            APK_SOURCE=$(find "${{ github.workspace }}/android/app/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' -print -quit)
            [[ -n "$APK_SOURCE" && -s "$APK_SOURCE" ]]
            cp "$APK_SOURCE" "$APK"
          fi
          if [[ ! -s "$AAB" ]]; then
            AAB_SOURCE=$(find "${{ github.workspace }}/android/app/build/outputs/bundle/release" -maxdepth 1 -type f -name '*.aab' -print -quit)
            [[ -n "$AAB_SOURCE" && -s "$AAB_SOURCE" ]]
            cp "$AAB_SOURCE" "$AAB"
          fi
          test -s "$APK"
          test -s "$AAB"
          sha256sum "$APK" "$AAB"
          {
            echo "## Android Release Artifacts"
            echo ""
            echo "| Artifact | Status | SHA-256 |"
            echo "|---|---|---|"
            echo "| app-release.apk | Ready | \\`$(sha256sum "$APK" | cut -d' ' -f1)\\` |"
            echo "| app-release.aab | Ready | \\`$(sha256sum "$AAB" | cut -d' ' -f1)\\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Web artifact
        shell: bash
        run: test -s "${{ github.workspace }}/dist/index.html"

      - name: Upload Web artifact
        uses: actions/upload-artifact@v7
        with:
          name: sky-bird-web
          path: ${{ github.workspace }}/dist
          if-no-files-found: error

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sky-bird-android-release
          path: |
            ${{ github.workspace }}/android/app/build/outputs/apk/release/app-release.apk
            ${{ github.workspace }}/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
