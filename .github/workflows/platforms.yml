name: Build shared platforms

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: sky-bird-web
          path: dist

  desktop:
    name: Desktop ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            target: win
          - name: macOS
            runner: macos-latest
            target: mac
          - name: Linux
            runner: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y binutils
      - run: npx electron-builder --${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: sky-bird-desktop-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  ios-validation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Validate iOS simulator build without signing
        working-directory: ios
        run: xcodebuild -project App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  macos-swiftui:
    name: macOS SwiftUI native
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build SwiftUI macOS app
        working-directory: macos/SkyBirdMac
        run: swift build -c release
