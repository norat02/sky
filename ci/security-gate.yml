name: Security TDD Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  security-regression:
    name: Security TDD F-2 to F-10 and regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete security and regression pipeline
        run: npm run ci:security

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Check sensitive files are not tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|)/\.env($|\.(local|production|development|test))|(^|/).*\.(jks|keystore|p12|pem|key)$'; then
            echo 'Sensitive file detected in Git history/index.'
            exit 1
          fi

      - name: Signing secrets preparation script self-test
        shell: bash
        run: bash scripts/encode-signing-secrets.sh --self-test

      - name: Upload generated web artifact
        uses: actions/upload-artifact@v7
        with:
          name: security-gate-web
          path: dist
          if-no-files-found: error
          retention-days: 7

  browser-regression:
    name: Browser end-to-end regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # The suites bind fixed static-server ports, so they run sequentially.
      - name: Run browser end-to-end suites
        run: |
          set -euo pipefail
          npm run test:e2e
          npm run test:e2e:admin
          npm run test:e2e:backup
          npm run test:e2e:backup:attack
          npm run test:e2e:characters-xss
          npm run test:e2e:purchase
          npm run test:e2e:auth
